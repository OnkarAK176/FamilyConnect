services:
  - type: web
    name: familyconnect-api
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: FAMILYCONNECT_TOKEN_SECRET
        generateValue: true
      - key: FAMILYCONNECT_ALLOWED_ORIGINS
        value: https://your-netlify-site.netlify.app
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
