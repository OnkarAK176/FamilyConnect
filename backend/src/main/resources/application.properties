spring.application.name=FamilyConnect API
spring.datasource.url=jdbc:h2:mem:familyconnect;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
familyconnect.token.secret=${FAMILYCONNECT_TOKEN_SECRET:family-connect-demo-secret}
familyconnect.cors.allowed-origins=${FAMILYCONNECT_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
